[tool.poetry]
name = "tree_diff"
version = "0.0.1"
description = "Tree Diff for incremental learning"
authors = ["Scott Barnett"]
packages = [{include = "keep_remine_prune"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.10"
river = "^0.14.0"
scikit-learn = "^1.2.0"

plotly = "^6.0"

gmpy2 = "^2.1.5"
bitarray = "^2.6.1"
imodels = "^1.3.12"
graphviz = "^0.20.1"

chefboost = "^0.0.19"

python-weka-wrapper3 = "^0.3.3"

surround = "^0.1.2"

pm4py = "^2.7"

PySide6 = "^6.7"

filelock = "^3.13"


[tool.poetry.group.dev.dependencies]
surround = "0.1.2"
doit = "0.31.1"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "chefboost (>=0.0.19,<0.0.20)"
]
